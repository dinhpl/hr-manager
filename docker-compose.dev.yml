services:
  db:
    container_name: hr-postgres-dev
    image: postgres:16-alpine
    command: ['postgres', '-p', '5532']
    environment:
      POSTGRES_DB: hr_leave_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - '5532:5532'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d hr_leave_db -p 5532']
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

  backend:
    container_name: hr-backend-dev
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -lc "
        apk add --no-cache openssl &&
        corepack enable &&
        pnpm install --frozen-lockfile --ignore-scripts=false &&
        pnpm exec prisma generate &&
        pnpm exec prisma db push --accept-data-loss &&
        USER_COUNT=$(node -e \"const { PrismaClient } = require('@prisma/client'); const p = new PrismaClient(); p.user.count().then(n => { console.log(n); return p['$disconnect'](); }).catch(() => { console.log(0); process.exit(0); });\") &&
        if [ \"$USER_COUNT\" = \"0\" ]; then pnpm exec tsx prisma/seed.ts; fi &&
        pnpm exec tsx prisma/seed-holidays.ts &&
        mkdir -p uploads &&
        pnpm dev
      "
    ports:
      - '5501:5501'
    depends_on:
      db:
        condition: service_healthy
    environment:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:secret@db:5532/hr_leave_db
      JWT_ACCESS_SECRET: change-me-in-production-at-least-32-chars
      JWT_REFRESH_SECRET: change-me-in-production-too-at-least-32
      FRONTEND_URL: http://localhost:5500
      NODE_ENV: development
      PORT: 5501
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-no-reply@ota.local}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-OTA HR System}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
    networks:
      - backend

  frontend:
    container_name: hr-frontend-dev
    image: node:20-alpine
    working_dir: /app
    command: >
      sh -lc "
        corepack enable &&
        pnpm install --frozen-lockfile &&
        pnpm dev --hostname 0.0.0.0 --port 5500
      "
    ports:
      - '5500:5500'
    depends_on:
      - backend
    environment:
      CI: 'true'
      NODE_ENV: development
      PORT: 5500
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:5501
      BACKEND_URL: http://backend:5501
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./:/app
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
